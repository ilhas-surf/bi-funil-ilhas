name: Update BI

on:
  schedule:
    # Quarta 15:00 UTC = 12:00 BRT (2h antes da reunião das 14h)
    - cron: '0 15 * * 3'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download planilha do Google Sheets
        run: |
          curl -sL --fail -o funil_ilhas.xlsx \
            "https://docs.google.com/spreadsheets/d/1rAlchmcUZTdoQ8KBcAs9h95YuuzsZf0e/export?format=xlsx"
          ls -la funil_ilhas.xlsx
          file funil_ilhas.xlsx

      - name: Build dashboard
        run: |
          node build_bi.js
          node build_dashboard.js

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
